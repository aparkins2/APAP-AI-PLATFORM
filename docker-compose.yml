version: '3.8'

services:
  # 1. Private Ollama LLM Engine (Port 11434 isolated inside Docker bridge)
  ollama:
    image: ollama/ollama:latest
    container_name: apap-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - apap-ai-network
    deploy:
      resources:
        reservations:
          memory: 4G
        limits:
          memory: 12G

  # 2. APAP AI Server, Gateway & Management Dashboard (Port 3000)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apap-ai-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OLLAMA_BASE_URL=http://ollama:11434
      - AI_FAST_MODEL=${AI_FAST_MODEL:-qwen3.5:4b}
      - AI_SMART_MODEL=${AI_SMART_MODEL:-qwen3.5:9b}
      - MASTER_ADMIN_KEY=${MASTER_ADMIN_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - ollama
    networks:
      - apap-ai-network

  # 3. Open WebUI (Internal Admin Playground at port 8080)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: apap-open-webui
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "127.0.0.1:3101:8080"
    depends_on:
      - ollama
    networks:
      - apap-ai-network

  # 4. Redis for Rate Limiting & Queue Coordination
  redis:
    image: redis:7-alpine
    container_name: apap-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - apap-ai-network

networks:
  apap-ai-network:
    name: apap-ai-network
    driver: bridge

volumes:
  ollama_data:
  open_webui_data:
  redis_data:
